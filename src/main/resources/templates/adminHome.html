<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Admin Home</title>

<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

	<nav class="navbar navbar-expand-lg navbar-light bg-light">
		<div class="container-fluid">
			<a class="navbar-brand" href="#">Event Planner</a>
			<div class="collapse navbar-collapse" id="navbarNavAltMarkup">
				<div class="navbar-nav">
					<a class="nav-link active" aria-current="page" href="/home">Home</a>
					<a class="nav-link" href="/logout">Logout</a>
				</div>
			</div>
		</div>
	</nav>

	<div class="container mt-4">
		<div class="d-flex justify-content-between align-items-center mb-3">
			<h2>All Events</h2>
			<a href="/admin/events/new" class="btn btn-success">+ Create
				Event</a>
		</div>

		<div class="row">
			<!-- Loop through events -->
			<div class="col-md-4 mb-3" th:each="event : ${events}">
				<div class="card shadow-sm h-100">
					<div class="card-body">
						<h5 class="card-title" th:text="${event.title}">Event Title</h5>
						<h6 class="card-subtitle mb-2 text-muted">
							<span th:text="${#temporals.format(event.date, 'dd-MM-yyyy')}"></span>
							| <span
								th:text="${#temporals.format(event.startDateTime, 'HH:mm')}"></span>
							- <span
								th:text="${#temporals.format(event.endDateTime, 'HH:mm')}"></span>
						</h6>

						<p class="card-text" th:text="${event.description}">Event
							description</p>
						<p>
							<strong>Location: </strong><span th:text="${event.location}"></span>
						</p>

						<!-- Buttons -->
						<a th:href="@{/admin/events/edit/{id}(id=${event.id})}"
							class="btn btn-warning btn-sm">Edit</a> <a
							th:href="@{/admin/events/delete/{id}(id=${event.id})}"
							class="btn btn-danger btn-sm"
							onclick="return confirm('Are you sure you want to delete this event?');">Delete</a>
						<a th:href="@{/admin/rsvpSummary/{id}(id=${event.id})}"
							class="btn btn-info btn-sm">RSVP Summary</a>
					</div>
				</div>
			</div>
		</div>
	</div>

</body>
</html>
