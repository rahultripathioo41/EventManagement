<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Create/Edit Event</title>
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

	<h2 th:text="${event.id} != null ? 'Edit Event' : 'Create Event'"></h2>

	<form th:action="@{/admin/events/save}" th:object="${event}"
		method="post" class="mt-3">
		<input type="hidden" th:field="*{id}" />

		<!-- Title -->
		<div class="mb-3">
			<label class="form-label">Title</label> <input type="text"
				class="form-control" th:field="*{title}" required>
		</div>

		<!-- Description -->
		<div class="mb-3">
			<label class="form-label">Description</label>
			<textarea class="form-control" th:field="*{description}" required></textarea>
		</div>

		<!-- Date -->
		<div class="mb-3">
			<label class="form-label">Date</label> <input type="date"
				class="form-control" th:field="*{date}" required>
		</div>

		<!-- Start DateTime -->
		<!-- Start DateTime -->
		<div class="mb-3">
			<label class="form-label">Start Date & Time</label> <input
				type="datetime-local" class="form-control"
				th:field="*{startDateTime}" required>
		</div>

		<!-- End DateTime -->
		<div class="mb-3">
			<label class="form-label">End Date & Time</label> <input
				type="datetime-local" class="form-control" th:field="*{endDateTime}"
				required>
		</div>


		<!-- Location -->
		<div class="mb-3">
			<label class="form-label">Location</label> <input type="text"
				class="form-control" th:field="*{location}" required>
		</div>

		<!-- Buttons -->
		<button type="submit" class="btn btn-success">Save</button>
		<a href="/admin/events" class="btn btn-secondary">Cancel</a>
	</form>

</body>
</html>
