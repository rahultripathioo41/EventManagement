<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My RSVP Events</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Event Planner</a>
        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav">
                <a class="nav-link" href="/user/home">Home</a>
                <a class="nav-link active" aria-current="page" href="/user/rsvpEvents">My RSVP Events</a>
                <a class="nav-link" href="/logout">Logout</a>
            </div>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2 class="mb-4">Events You Responded To</h2>

    <div class="row" id="rsvpEvents">
        <!-- Loop through RSVP'd events -->
        <div class="col-md-4 mb-3" th:each="event : ${events}">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h5 class="card-title" th:text="${event.title}">Event Title</h5>
                    <h6 class="card-subtitle mb-2 text-muted">
                        <span th:text="${#temporals.format(event.date, 'dd-MM-yyyy')}"></span>
                        | <span th:text="${#temporals.format(event.startDateTime, 'HH:mm')}"></span>
                        - <span th:text="${#temporals.format(event.endDateTime, 'HH:mm')}"></span>
                    </h6>

                    <p class="card-text" th:text="${event.description}">Event description...</p>
                    <p><strong>Location: </strong><span th:text="${event.location}"></span></p>

                    <button class="btn btn-success" disabled>
                        Your RSVP: <span th:text="${userRsvps[event.id]}"></span>
                    </button>
                    <a th:href="@{/user/events/{id}(id=${event.id})}" class="btn btn-link">Change RSVP</a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
